services:
  atom2api:
    image: docker.io/cnluminous/atom2api:1.0.2
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ATOM2API_CONFIG: /data/config.json
    volumes:
      - atom2api-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  atom2api-data:
